# Sitio de Radio Marea · https://radio.iaw.local  (en tu navegador: https://localhost:8452)
# Después de cambiarlo: ./practica.sh recargar  (hace nginx -t antes de recargar: si hay un error, te dice la línea)

# 👀 Por HTTP, nada: todo se manda a HTTPS (la UD3).
server {
    listen 80 default_server;
    server_name radio.iaw.local;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl default_server;
    server_name radio.iaw.local;

    ssl_certificate     /etc/ssl/lab/lab.crt;       # 👀 certificado de prueba para *.iaw.local
    ssl_certificate_key /etc/ssl/lab/lab.key;

    root /var/www/radio;                            # la carpeta web/ del kit
    # ✍️ A1 · La portada es index.php: que https://radio.iaw.local/ la enseñe (ahora solo busca index.html).
    index index.html;

    access_log /var/log/nginx/radio_access.log;
    error_log  /var/log/nginx/radio_error.log;

    # 👀 Los ficheros que existen (estilo.css, el logo…) los sirve Nginx; si no existen, 404.
    location / {
        try_files $uri $uri/ =404;
    }

    # ✍️ A1 · Los .php, a PHP-FPM: el contenedor «php», puerto 9000 (UD4, apartado 2).
    #         Que un .php que no existe dé el 404 de Nginx, sin molestar a PHP.


    # ✍️ A4 · Lo que no debe verse desde fuera (UD4, apartado 9.3), con un 403:
    #         - diagnostico.php (un phpinfo(): versión, rutas, módulos…);
    #         - la carpeta inc/ (se incluye desde PHP, nunca se pide desde el navegador).
    #         Ojo: tienen que ganar a la location de los .php. Piensa qué tipo de location gana a una ~.


    # ✍️ B1 · Todo lo que empieza por /api/, a la API (contenedor «app», Gunicorn, puerto 8000) (UD5, apartado 2).
    #         La API tiene que saber el nombre que pidió el oyente, su IP de verdad y que entró por https.

}
