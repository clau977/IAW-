limit_req_zone $binary_remote_addr zone=zona_nimbus:10m rate=4r/s;
server {
	listen 80;
	server_name brisa-docs.nimbus.test cumbre-interno.nimbus.test;
	return 301 https://$host$request_uri;
}
server {
	listen 443 ssl;
	server_name brisa-docs.nimbus.test cumbre-interno.nimbus.test;
	
	ssl_certificate /etc/nginx/certs/nimbus.crt;
	ssl_certificate_key /etc/nginx/certs/nimbus.key;
	ssl_protocols TLSv1.2 TLSv1.3;
	ssl_ciphers ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-ECDSA-CHACHA20-POLY1305;
	ssl_prefer_server_ciphers on;

	add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
	add_header X-Content-Type-Options "nosniff" always;
	add_header X-Frame-Options "DENY" always;
	
	location / {
#		limit_req zone=zona_nimbus burst=6 nodelay;
		limit_req_status 429;
	
		proxy_pass http://127.0.0.1:8087;
	}
}
