<VirtualHost *:8087>
	ServerName cumbre-interno.nimbus.test
	DocumentRoot /var/www/cumbre
	ErrorLog ${APACHE_LOG_DIR}/cumbre_error.log
	CustomLog ${APACHE_LOG_DIR}/cumbre_access.log combined
	<Directory /var/www/cumbre>
		Options -Indexes
		Require all granted
		<Files "claves_internas.ini">
			Require all denied
		</Files>
	</Directory>
</VirtualHost>
